name: leaflens
description: "LeafLens — AI-powered plant identification app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Backend & Auth
  supabase_flutter: ^2.3.4
  google_sign_in: ^6.2.1

  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  cached_network_image: ^3.3.1

  # Networking
  dio: ^5.4.3

  # Storage
  shared_preferences: ^2.2.3

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Share
  share_plus: ^9.0.0

  # Splash
  flutter_native_splash: ^2.4.0

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
